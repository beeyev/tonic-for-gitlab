<!--
GitLab version: 19.0, the oldest supported minor that renders this placement
Surface: Repository file tree browser on a blob page, with the "Provide feedback" link rendered as
the panel's last child, which is how 18.7 through 19.0 place it. 19.1 moved it to a fixed-position
sibling and 19.2 removed it, so the two surviving placements are named rather than versioned.
Source type: independently reconstructed 2026-08-31 from the official v18.11.9-ee
`app/views/projects/blob/show.html.haml`, `file_tree_browser.vue`, and `tree_list.vue` post-mount
contract, which is the same placement 19.0 renders; re-baselined to 19 on 2026-09-13 without
re-reconstructing against 19-0-stable
Sanitization: component state, Vue bindings, layout utility classes, tracking attributes, icon
sprite references, resizer internals, and all but one file tree row removed; the sibling file
content is reduced to a single external link that carries the same icon; no executable scripts
-->
<div class="navigation-root">
	<div class="gl-relative">
		<!--
		The peek-mode overlay, a `v-if` sibling rendered before the panel in all of
		18.7 through 19.1. It precedes the panel, so the following-sibling selector
		this feature observes must not match it.
		-->
		<div class="file-tree-browser-overlay" data-testid="overlay"></div>
		<div class="file-tree-browser file-tree-browser-responsive">
			<div class="drag-handle"></div>
			<section aria-labelledby="tree-list-heading">
				<h3 id="tree-list-heading">Files</h3>
				<nav aria-label="File tree">
					<ul role="tree">
						<li role="treeitem" aria-level="1">
							<a href="/example/project/-/blob/main/versions.tf">versions.tf</a>
						</li>
					</ul>
				</nav>
			</section>
			<a
				rel="noopener noreferrer"
				target="_blank"
				href="https://gitlab.com/gitlab-org/gitlab/-/issues/581271"
				class="btn gl-button btn-default btn-md"
			>
				<svg data-testid="comment-dots-icon" role="img" aria-hidden="true"></svg>
				<span class="gl-button-text">Provide feedback</span>
			</a>
		</div>
	</div>
	<div id="tree-holder">
		<!--
		The rendered file content, a sibling of the browser's Vue root rather than a
		descendant. It carries an external link with the same icon so a resolution
		scope that widened past the Vue root, or a mutation selector that reached
		the content, would be caught by a test rather than shipped.
		-->
		<a rel="noopener noreferrer" target="_blank" href="https://docs.gitlab.com/">
			<svg data-testid="comment-dots-icon" role="img" aria-hidden="true"></svg>
			<span>Docs</span>
		</a>
	</div>
</div>
