name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable extension version (MAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

env:
  EXTENSION_TELEMETRY_DISABLED: "1"

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Require a master dispatch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail
          if [[ "$DISPATCH_REF" != "refs/heads/master" ]]; then
            printf 'Prepare release must be dispatched from master, got %s\n' "$DISPATCH_REF" >&2
            exit 1
          fi

      - name: Check out dispatch commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate workflows
        uses: raven-actions/actionlint@v2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Restore the Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Validate release version
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          bun run release:validate-version >> "$GITHUB_OUTPUT"
          printf 'commit_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing tag or published release
        uses: ./.github/actions/refuse-existing-release
        with:
          tag: ${{ steps.release.outputs.tag }}
          token: ${{ github.token }}
          # This job only has read access, so drafts stay invisible here and are
          # rechecked by the release job.
          release-label: published release

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun run verify` also builds, but the release archives are built below
      # from the dispatched version, so the extra build would be thrown away.
      - name: Check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build and pack release archives
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: bun run release:pack

      - name: Upload verified release assets
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  attest:
    name: Attest provenance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Isolated from `build` on purpose: that job installs and executes
    # third-party code, and must never hold a token that can mint a Sigstore
    # signing identity.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-assets

      - name: Verify downloaded checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS

      # SHA256SUMS is attested alongside the archives because it is what people
      # read first. Verify any of them with:
      #   gh attestation verify <file> --repo ${{ github.repository }}
      - name: Attest release asset provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release-assets/tonic-for-gitlab-*.zip
            release-assets/SHA256SUMS

  release:
    name: Create draft release
    needs: [build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the release actions
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Download verified release assets
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-assets

      - name: Verify downloaded checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS

      - name: Refuse an existing tag or release
        uses: ./.github/actions/refuse-existing-release
        with:
          tag: ${{ needs.build.outputs.tag }}
          token: ${{ github.token }}
          release-label: release or draft

      - name: Create draft release
        uses: ncipollo/release-action@v1
        with:
          name: Tonic for GitLab ${{ needs.build.outputs.version }}
          tag: ${{ needs.build.outputs.tag }}
          commit: ${{ needs.build.outputs.commit_sha }}
          draft: true
          prerelease: false
          generateReleaseNotes: true
          allowUpdates: false
          replacesArtifacts: false
          artifactErrorsFailBuild: true
          artifacts: |
            release-assets/tonic-for-gitlab-${{ needs.build.outputs.version }}-chromium.zip
            release-assets/tonic-for-gitlab-${{ needs.build.outputs.version }}-firefox.zip
            release-assets/SHA256SUMS
          body: |
            Prepared from commit [`${{ needs.build.outputs.commit_sha }}`](https://github.com/${{ github.repository }}/commit/${{ needs.build.outputs.commit_sha }}).

            GitHub Actions run [#${{ github.run_number }}, attempt ${{ github.run_attempt }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            The Chromium archive supports Chrome, Edge, Brave, and Vivaldi. The Firefox archive is unsigned and is intended for temporary installation until it is signed by Mozilla.
