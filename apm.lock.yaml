mcp_servers:
- chrome-devtools
- extension-dev
- extensionjs
- playwright
- shadcn
mcp_configs:
  chrome-devtools:
    name: chrome-devtools
    transport: stdio
    env:
      npm_config_cache: /tmp/gitlab-tonic-npm-cache
    args:
    - chrome-devtools-mcp@latest
    - --category-extensions=true
    - --isolated=true
    - --viewport=1280x800
    - --screenshot-max-width=1600
    - --no-usage-statistics
    registry: false
    command: bunx
  extension-dev:
    name: extension-dev
    transport: stdio
    env:
      EXTENSION_HEADLESS: '0'
      EXTENSION_BROWSER_FLAGS: ''
    args:
    - '@extension.dev/mcp@latest'
    registry: false
    command: bunx
  extensionjs:
    name: extensionjs
    transport: http
    registry: false
    url: https://extensionjs.mintlify.app/mcp
  playwright:
    name: playwright
    transport: stdio
    args:
    - '@playwright/mcp@latest'
    - --browser=chrome
    - --viewport-size=1280x800
    - --caps=pdf,devtools
    registry: false
    command: bunx
  shadcn:
    name: shadcn
    transport: stdio
    env:
      TMPDIR: /tmp
      BUN_INSTALL_CACHE_DIR: .cache/bun
    args:
    - --bun
    - shadcn@latest
    - mcp
    registry: false
    command: bunx
mcp_target_servers:
  claude:
  - chrome-devtools
  - extension-dev
  - extensionjs
  - playwright
  - shadcn
  codex:
  - chrome-devtools
  - extension-dev
  - extensionjs
  - playwright
  - shadcn
  cursor:
  - chrome-devtools
  - extension-dev
  - extensionjs
  - playwright
  - shadcn
  opencode:
  - chrome-devtools
  - extension-dev
  - extensionjs
  - playwright
  - shadcn
  vscode:
  - chrome-devtools
  - extension-dev
  - extensionjs
  - playwright
  - shadcn
